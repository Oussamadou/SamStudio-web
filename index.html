      const [contactSubmitting, setContactSubmitting] = useState(false);
      const [contactSuccess, setContactSuccess] = useState(false);

      const t = i18n[lang];

      // Handle Scroll for Header Transformation
      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 30);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Dynamic RTL / LTR HTML Attribute Synchronization
      useEffect(() => {
        document.documentElement.dir = t.dir;
      }, [lang]);

      // Keyboard navigation for Pitch Deck Modal (Phase 8)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!deckModalOpen) return;
          if (e.key === 'ArrowRight' || e.key === ' ') {
            setActiveDeckSlide(prev => Math.min(pitchDeckSlides.length - 1, prev + 1));
          } else if (e.key === 'ArrowLeft') {
            setActiveDeckSlide(prev => Math.max(0, prev - 1));
          } else if (e.key === 'Escape') {
            setDeckModalOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [deckModalOpen]);

      const currentPromptObj = aiPromptsLibrary.find(p => p.id === activePromptTab) || aiPromptsLibrary[0];

      const handleCopyPrompt = () => {
        navigator.clipboard.writeText(currentPromptObj.prompt);
        setCopiedPrompt(true);
        setTimeout(() => setCopiedPrompt(false), 2500);
      };

        setSelectedCatalogItem(null);
        setRfqModalOpen(true);

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product: rfqProduct,
              quantity: rfqQty,
              country: rfqCountry,
              contact: rfqContact,
              notes: rfqNotes,
              lang: lang

          const data = await res.json();
          setRfqSubmitted(false);
          setRfqModalOpen(false);
          alert(t.rfqSuccess);
        } catch (err) {
          setRfqSubmitted(false);
          setRfqModalOpen(false);
          alert(t.rfqSuccess);
        }
      };

        e.preventDefault();
        if (!contactName || !contactValue) {
          alert('Please provide your name and contact information.');
          return;
        }
        setContactSubmitting(true);

                    </button>
                    <button 
                      disabled={activeDeckSlide === pitchDeckSlides.length - 1}
                      onClick={() => setActiveDeckSlide(prev => Math.min(pitchDeckSlides.length - 1, prev + 1))}
                      className="px-6 py-2.5 rounded-xl btn-gold-glow text-obsidian text-xs font-extrabold disabled:opacity-30 hover:opacity-95 transition-all shadow-glow-gold"
                    >
                      Next Slide →
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
