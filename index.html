    :root {

    /* Clean Awwwards Glassmorphism Design Tokens */
    .glass-card {
      background: rgba(24, 24, 27, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      transition: all 0.35s var(--ease-awwwards);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 0 30px -5px rgba(99, 102, 241, 0.2);
      transform: translateY(-3px);
    }
    .glass-card-gold:hover {
      border-color: rgba(229, 193, 88, 0.35);
      box-shadow: 0 0 30px -5px rgba(229, 193, 88, 0.2);
    }
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }
    .text-gradient-gold {
      background: linear-gradient(135deg, #FFFFFF 0%, #E5C158 50%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-violet {
      background: linear-gradient(135deg, #FFFFFF 0%, #818CF8 50%, #6366F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Interactive Button Magnetic Glows */
    .btn-gold-glow {
      background: linear-gradient(135deg, #E5C158 0%, #D4AF37 100%);
      box-shadow: 0 0 20px rgba(229, 193, 88, 0.3);
      transition: all 0.25s var(--ease-awwwards);
    }
    .btn-gold-glow:hover {
      box-shadow: 0 0 35px rgba(229, 193, 88, 0.5);
      transform: scale(1.02);
    }
    .btn-gold-glow:active {
      transform: scale(0.98);
    }

    /* Modern CSS Scroll-Driven Reveal Animations (Reference Video Architecture) */
    @keyframes scrollReveal {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .scroll-reveal {
      animation: scrollReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @supports (animation-timeline: view()) {
      .scroll-driven {
        animation: scrollReveal linear both;
        animation-timeline: view();
        animation-range: entry 10% cover 30%;
      }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090B;
    }
    ::-webkit-scrollbar-thumb {
      background: #242429;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6366F1;
    }

    /* Mobile Horizontal Scroll Utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

                    </div>

                    <h4 className="text-lg sm:text-2xl md:text-3xl font-extrabold text-white mb-3 leading-tight">
                      {pitchDeckSlides[activeDeckSlide].title[lang] || pitchDeckSlides[activeDeckSlide].title.EN}
                    </h4>

                    <p className="text-zinc-300 text-xs sm:text-sm md:text-base leading-relaxed max-w-xl">
                      {pitchDeckSlides[activeDeckSlide].sub[lang] || pitchDeckSlides[activeDeckSlide].sub.EN}
                    </p>
                  </div>

                  <div className="pt-4 mt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-1.5">
                      <span className="text-[10px] font-mono text-zinc-500">Highlight:</span>
                      <span className="px-2 py-0.5 rounded bg-accent-violet/20 border border-accent-violet/40 text-accent-violet-glow font-mono font-bold text-[10px]">
                        {pitchDeckSlides[activeDeckSlide].metric}
                      </span>
                    </div>

                    <div className="text-[10px] font-mono text-zinc-500">
                      Slide {activeDeckSlide + 1} / {pitchDeckSlides.length}
                    </div>
                  </div>

                </div>

                {/* Pagination Controls */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 mt-1 border-t border-white/10">
                  <div className="flex items-center gap-1 overflow-x-auto py-1">
                    {pitchDeckSlides.map((s, idx) => (
                      <button
                        key={idx}
                        onClick={() => setActiveDeckSlide(idx)}
                        className={`h-1.5 rounded-full transition-all duration-200 ${
                          activeDeckSlide === idx 
                            ? 'w-6 bg-accent-gold shadow-glow-gold' 
                            : 'w-1.5 bg-white/20 hover:bg-white/40'
                        }`}
                        aria-label={`Go to slide ${idx + 1}`}
                      />
                    ))}
                  </div>

                  <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <button 
                      disabled={activeDeckSlide === 0}
                      onClick={() => setActiveDeckSlide(prev => Math.max(0, prev - 1))}
                      className="px-4 py-2 rounded-xl bg-zinc-card border border-white/10 text-xs font-bold text-white disabled:opacity-30 hover:bg-white/10 transition-colors"
                    >
                      ← Prev
                    </button>
                    <button 
                      disabled={activeDeckSlide === pitchDeckSlides.length - 1}
                      onClick={() => setActiveDeckSlide(prev => Math.min(pitchDeckSlides.length - 1, prev + 1))}
                      className="px-5 py-2 rounded-xl btn-gold-glow text-obsidian text-xs font-extrabold disabled:opacity-30 hover:opacity-95 transition-all shadow-glow-gold"
                    >
                      Next →
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
